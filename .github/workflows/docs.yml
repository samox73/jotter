name: docs
on:
  push:
    branches: [main]
    # reference pages are generated from src/, so source changes redeploy too
    paths: [docs/**, src/**, assets/**, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, src/**, assets/**, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "last updated" dates come from git history
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      # feature clips: re-recorded only when a scene, notebook or jotter changed
      - uses: actions/cache@v4
        id: media
        with:
          path: docs/public/media
          key: media-${{ hashFiles('docs/media/**', 'src/**', 'Cargo.lock', 'flake.nix', 'flake.lock') }}
      - if: steps.media.outputs.cache-hit != 'true'
        uses: cachix/install-nix-action@v31
      - if: steps.media.outputs.cache-hit != 'true'
        run: nix develop .#docs -c nu docs/media/record.nu -j 2 # runners have 4 cores
      - run: npm ci
        working-directory: docs
      - run: npm run build # runs `jotter --generate` first; fails on broken links
        working-directory: docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
