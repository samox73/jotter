name: docs
on:
  push:
    branches: [main]
    paths: [README.md, docs/**, assets/**]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar xz
      - run: cp -r assets docs/src/ && ./mdbook build docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book
      - id: deploy
        uses: actions/deploy-pages@v4
