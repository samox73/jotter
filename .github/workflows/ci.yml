name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # the kernel and nvim layers are only exercised against the real
      # programs: their tests are #[ignore]d and need ipykernel, jupytext and nvim
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ipykernel jupytext
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
        env:
          # /tmp is another filesystem on ubuntu-26.04 and the action's rename
          # fails with EXDEV; drop once rhysd/action-setup-vim#80 is fixed
          TMPDIR: ${{ runner.temp }}
      - run: echo "JUPYTER_PATH=$(python -c 'import sys; print(sys.prefix)')/share/jupyter" >> "$GITHUB_ENV"
      - run: cargo test -- --ignored

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release --locked
