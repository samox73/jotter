name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # static musl binaries run on every Linux distro regardless of glibc
          - { arch: x86_64, os: linux, runner: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { arch: aarch64, os: linux, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { arch: aarch64, os: macos, runner: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        run: test "${GITHUB_REF_NAME#v}" = "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: |
          cp target/${{ matrix.target }}/release/jotter .
          strip jotter
          ./jotter --generate gen # man page + shell completions
          mv gen/man gen/completions .
          tar czf jotter-${{ matrix.arch }}-${{ matrix.os }}.tar.gz jotter man completions README.md LICENSE-MIT LICENSE-APACHE licenses
      - uses: actions/upload-artifact@v4
        with:
          name: jotter-${{ matrix.target }}
          path: jotter-${{ matrix.arch }}-${{ matrix.os }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-cliff reads the history back to the previous tag
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: deb / rpm / apk
        run: |
          export VERSION=${GITHUB_REF_NAME#v}
          for a in x86_64:amd64 aarch64:arm64; do
            tar xzf jotter-${a%%:*}-linux.tar.gz jotter man completions
            for f in deb rpm apk; do ARCH=${a#*:} ~/go/bin/nfpm pkg -f pkg/nfpm.yaml -p $f; done
          done
          sha256sum *.tar.gz *.deb *.rpm *.apk > SHA256SUMS
      - name: Release notes
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.deb
            *.rpm
            *.apk
            SHA256SUMS
          body_path: RELEASE_NOTES.md

  crates-io:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # PyPI wheels: the same binary, for `uv tool install jotter-tui`
  wheels:
    needs: build
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-latest, target: aarch64-unknown-linux-gnu } # cross-compiled in maturin's manylinux cross image
          - { runner: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto # built in an old-glibc container, so the wheel runs on any current distro
          args: --release --locked --strip --out dist
        env:
          # the cross image's old gcc doesn't define it, and ring's ARM assembly needs it
          CFLAGS_aarch64_unknown_linux_gnu: -D__ARM_ARCH=8
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist

  pypi:
    needs: wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing, no API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
