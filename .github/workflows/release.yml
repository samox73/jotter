name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        run: test "${GITHUB_REF_NAME#v}" = "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # static musl binary: runs on every distro regardless of glibc
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.arch }}-unknown-linux-musl
      - run: |
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/jotter .
          strip jotter
          tar czf jotter-${{ matrix.arch }}-linux.tar.gz jotter README.md LICENSE-MIT LICENSE-APACHE
      - uses: actions/upload-artifact@v4
        with:
          name: jotter-${{ matrix.arch }}
          path: jotter-${{ matrix.arch }}-linux.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: deb / rpm / apk
        run: |
          export VERSION=${GITHUB_REF_NAME#v}
          for a in x86_64:amd64 aarch64:arm64; do
            tar xzf jotter-${a%%:*}-linux.tar.gz jotter
            for f in deb rpm apk; do ARCH=${a#*:} ~/go/bin/nfpm pkg -f pkg/nfpm.yaml -p $f; done
          done
          sha256sum *.tar.gz *.deb *.rpm *.apk > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.deb
            *.rpm
            *.apk
            SHA256SUMS
          generate_release_notes: true

  crates-io:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
