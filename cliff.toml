# git-cliff: CHANGELOG.md and release notes from conventional commits.
#   git cliff --tag vX.Y.Z -o CHANGELOG.md   # before tagging a release

[changelog]
header = """
# Changelog

Every release of jOtter. The same notes are on each [GitHub release](https://github.com/samox73/jotter/releases).
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% if not previous.version %}
First release.
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/samox73/jotter/commit/{{ commit.id }}))
{% endfor %}\
{% endfor %}
"""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
# Release-note wording for commits already pushed (history can't change):
# 92f61df also carried the crash-on-terminal-close fix.
commit_preprocessors = [
  { pattern = '^fix: stall until ipython/ipykernel#1529 arrives', replace = "fix: cells no longer hang after completion with ipykernel 7, and closing the terminal doesn't crash jOtter" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^(refactor|style|test|chore|ci|build)", skip = true },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
