[package]
name = "jotter"
description = "jOtter — a fast Jupyter notebook TUI. The Jupyter otter. 🦦"
version = "0.1.0"
edition = "2024"

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
image = "0.25.10"
jupyter-protocol = "2.0.2"
jupyter-zmq-client = { version = "1.0.1", features = ["tokio-runtime"] }
libc = "0.2.189"
log = "0.4"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["image-defaults", "crossterm"] }
ratex-layout = "0.1.11"
ratex-parser = "0.1.11"
ratex-svg = { version = "0.1.11", features = ["embed-fonts"] }
ratex-types = "0.1.11"
resvg = "0.47"
rmpv = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syntect = "5.3.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal"] }
toml = "0.9"
unicode-width = "0.2"
uuid = { version = "1.26.1", features = ["v4"] }
