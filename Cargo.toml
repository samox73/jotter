[package]
name = "jututui"
version = "0.1.0"
edition = "2024"

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
jupyter-protocol = "2.0.2"
jupyter-zmq-client = { version = "1.0.1", features = ["tokio-runtime"] }
libc = "0.2.189"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syntect = "5.3.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
uuid = { version = "1.26.1", features = ["v4"] }
