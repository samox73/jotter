# kitty for record.nu: fixed font, colours and behaviour, so every frame is
# reproducible. Colours are base16-ocean, matching jOtter's default theme.
font_family JetBrains Mono
font_size 11.5
disable_ligatures always
cursor_blink_interval 0
cursor_shape block
window_padding_width 6
shell_integration disabled
allow_remote_control yes
enable_audio_bell no
confirm_os_window_close 0
remember_window_size no
background #2b303b
foreground #c0c5ce
selection_background #4f5b66
cursor #c0c5ce
color0  #2b303b
color1  #bf616a
color2  #a3be8c
color3  #ebcb8b
color4  #8fa1b3
color5  #b48ead
color6  #96b5b4
color7  #c0c5ce
color8  #65737e
color9  #bf616a
color10 #a3be8c
color11 #ebcb8b
color12 #8fa1b3
color13 #b48ead
color14 #96b5b4
color15 #eff1f5
